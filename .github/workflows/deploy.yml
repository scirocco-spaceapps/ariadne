name: deploy

# Rebuilds the services on the server when main changes something they run.
# Secrets (repo settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), DEPLOY_PATH (repo checkout on the server),
#   DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan <host>`).
on:
  push:
    branches: [main]
    paths:
      - "planner/**"
      - "mission-control/**"
      - "infra/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run infra/deploy.sh on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::DEPLOY_HOST is not set; skipping deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "sh '$DEPLOY_PATH/infra/deploy.sh'"
