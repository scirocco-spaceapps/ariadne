name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r contracts/requirements.txt
      - run: python contracts/check.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types match contracts
        run: npm run gen:types && git diff --exit-code -- src/lib/types.ts
      - run: npm run lint
      - run: npm run check

  planner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # Exit code 5 = no tests collected yet; pass until pipeline/tests/ exists.
      - run: python -m pytest || [ $? -eq 5 ]

  mission-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mission-control/go.mod
          cache-dependency-path: mission-control/go.sum
      - run: go vet ./...
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # demo90 in DEMO mode: starts the web dev server and replays contracts/fixtures (SYNTHETIC).
      - run: npm test
        env:
          E2E_MODE: demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-demo90
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
